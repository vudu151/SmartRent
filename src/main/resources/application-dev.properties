# Development Profile Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/smartrent_dev
spring.datasource.username=postgres
spring.datasource.password=123456

spring.security.user.name=${BASIC_AUTH_USER:admin}
spring.security.user.password=${BASIC_AUTH_PASSWORD:admin}

# JPA/Hibernate - Development
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Logging - More verbose in dev
logging.level.com.smartrent=DEBUG
logging.level.org.springframework.security=DEBUG
