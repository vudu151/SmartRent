# Application Configuration
spring.application.name=smartrent-backend
server.port=8080

# Database Configuration
# Password can be set via:
# 1. Environment variable: DB_PASSWORD
# 2. application-local.properties file (gitignored)
spring.datasource.url=jdbc:postgresql://localhost:5432/smartrent_dev
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
# Note: hibernate.dialect is auto-detected, no need to specify explicitly
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Logging Configuration
logging.level.com.smartrent=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# JWT Configuration
jwt.secret=your-secret-key-change-this-in-production-min-256-bits
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# CORS Configuration
spring.web.cors.allowed-origins=http://localhost:3000,http://localhost:5173
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Email Configuration (Gmail SMTP)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=your-email@gmail.com
spring.mail.password=your-app-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Increased timeouts to handle network issues
spring.mail.properties.mail.smtp.connectiontimeout=30000
spring.mail.properties.mail.smtp.timeout=30000
spring.mail.properties.mail.smtp.writetimeout=30000
# Disable mail health check to avoid connection errors on startup
management.health.mail.enabled=false

# Frontend URL for email links
app.frontend.url=http://localhost:5173

# Google OAuth Configuration
# Get these from: https://console.cloud.google.com/apis/credentials
# Note: With JavaScript SDK (current implementation), only client-id is needed
# Client secret is optional and only needed for server-side OAuth flow
google.oauth.client-id=your-google-client-id.apps.googleusercontent.com
google.oauth.client-secret=your-google-client-secret